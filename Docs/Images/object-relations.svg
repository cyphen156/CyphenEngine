  <text x="40" y="368" font-size="11" fill="#4b5563">* 일반 GameObject의 Detach는 Runtime 소속을 유지합니다. 다만 Component가 Detach되면 그 아래 GameObject는</text>
  <text x="52" y="385" font-size="11" fill="#4b5563">독립적인 실행 루트가 될 수 없으므로 Runtime을 떠나고, 다시 Attach되면 참여를 복구합니다.</text>
  <text x="40" y="408" font-size="11" fill="#4b5563">Destroy는 ObjectManager가 자식을 부모보다 먼저 파괴하므로, 각 계약 해제는 부모의 문맥이 살아 있는 동안 수행됩니다.</text>
  <text x="40" y="428" font-size="11" fill="#4b5563">Attach와 Admit은 참여 선언을 새로 결정하지 않습니다. 이미 선언된 참여를 실현할 실행 문맥만 제공합니다.</text>
